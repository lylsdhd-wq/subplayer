<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>边看边出字幕</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d; --card: #17171a; --card2: #222226; --line: #2c2c31;
    --text: #f2f2f4; --sub: #9a9aa3; --accent: #0a84ff; --green: #30d158; --red: #ff5f57; --amber: #ffb340;
    --r: 16px; --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(11, 11, 13, .78); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card2);
    transition: transform .25s var(--ease), background .2s; position: relative; }
  .icon-btn svg { width: 20px; height: 20px; transition: transform .5s var(--ease); }
  .icon-btn:active svg { transform: rotate(60deg); }
  .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--red);
    box-shadow: 0 0 0 2px var(--card2); animation: pulse 1.6s infinite; }

  .wrap { padding: 4px 16px 40px; max-width: 760px; margin: 0 auto; }

  /* 按压回弹 */
  .press { transition: transform .18s var(--ease), background .25s, color .25s, box-shadow .25s; }
  .press:active { transform: scale(.96); }

  /* 选视频 */
  .pick { display: flex; align-items: center; gap: 14px; padding: 18px; margin-top: 8px; border-radius: var(--r);
    background: var(--card); border: 1.5px dashed #3a3a40; cursor: pointer; }
  .pick input { display: none; }
  .pick .ico { width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, #0a84ff, #5e5ce6); }
  .pick b { display: block; font-size: 16px; }
  .pick small { color: var(--sub); font-size: 13px; }
  .has-video .pick { padding: 10px 12px; border-style: solid; border-color: transparent; }
  .has-video .pick .ico { width: 36px; height: 36px; font-size: 18px; border-radius: 10px; }
  .has-video .pick b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick > div { min-width: 0; flex: 1; }
  .pick .chg { font-size: 13px; color: var(--accent); font-weight: 600; flex: none; display: none; }
  .has-video .pick .chg { display: block; }

  /* 视频 */
  .player { margin-top: 12px; border-radius: var(--r); overflow: hidden; background: #000;
    max-height: 0; opacity: 0; transform: translateY(8px) scale(.98);
    transition: max-height .6s var(--ease), opacity .45s var(--ease), transform .5s var(--ease); }
  .has-video .player { max-height: 80vh; opacity: 1; transform: none; }
  video { width: 100%; display: block; background: #000; max-height: 70vh; }
  video::cue { font-size: .9em; background: rgba(0, 0, 0, .6); }

  /* 进入动画：选完视频后控制区依次浮现 */
  .reveal { opacity: 0; transform: translateY(14px); pointer-events: none;
    transition: opacity .45s var(--ease), transform .55s var(--ease); }
  body:not(.has-video) .reveal { display: none; }
  .shown .reveal { opacity: 1; transform: none; pointer-events: auto; }
  .d1 { transition-delay: .12s !important; } .d2 { transition-delay: .2s !important; } .d3 { transition-delay: .28s !important; }

  .card { background: var(--card); border-radius: var(--r); padding: 14px; margin-top: 12px; }

  /* 进度卡 */
  .prog-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .prog-top b { font-size: 15px; }
  .prog-top span { color: var(--sub); font-size: 13px; font-variant-numeric: tabular-nums; }
  #map { position: relative; display: flex; gap: 2px; height: 22px; margin: 12px 0 10px; border-radius: 6px; overflow: hidden; cursor: pointer; touch-action: manipulation; }
  #map i { flex: 1; min-width: 1px; background: #2a2a2f; transition: background .5s var(--ease); }
  #map i.s1 { background: var(--accent); animation: breathe 1.1s ease-in-out infinite; }
  #map i.s2 { background: var(--green); }
  #map i.s3 { background: var(--red); }
  #map i.pop { animation: pop .5s var(--ease); }
  #head { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #fff;
    box-shadow: 0 0 6px rgba(255, 255, 255, .7); left: 0; transition: left .3s linear; pointer-events: none; }
  #status { font-size: 13px; color: var(--sub); min-height: 1.4em; white-space: pre-wrap; line-height: 1.5; transition: color .3s; }
  #status.err { color: var(--red); }
  #status.flash { animation: fadeUp .35s var(--ease); }
  .retry { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border-radius: 12px;
    background: rgba(255, 95, 87, .14); color: var(--red); font-size: 14px; font-weight: 600;
    max-height: 0; margin: 0; opacity: 0; overflow: hidden; pointer-events: none;
    transition: max-height .4s var(--ease), margin .4s var(--ease), opacity .3s, transform .18s var(--ease); }
  .retry.show { max-height: 44px; height: 44px; margin: 10px 0 2px; opacity: 1; pointer-events: auto; }
  .retry .spin { display: inline-block; transition: transform .6s var(--ease); }
  .retry.go .spin { transform: rotate(360deg); }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--sub); margin-top: 8px; flex-wrap: wrap; }
  .legend em { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; font-style: normal; }

  /* 分段切换：滑块 */
  .seg { position: relative; display: flex; padding: 3px; border-radius: 12px; background: var(--card2); }
  .seg button { position: relative; z-index: 1; flex: 1; height: 38px; font-size: 14px; font-weight: 600; color: var(--sub); transition: color .3s; }
  .seg button.on { color: #fff; }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 9px; background: var(--accent);
    box-shadow: 0 2px 10px rgba(10, 132, 255, .45); transition: transform .42s var(--ease), width .42s var(--ease); }
  .label { font-size: 12px; color: var(--sub); margin: 0 2px 8px; font-weight: 600; letter-spacing: .5px; }

  /* 操作按钮 */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .act { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 14px; border-radius: var(--r);
    background: var(--card); text-align: left; min-height: 78px; }
  .act .t { font-size: 15px; font-weight: 700; }
  .act .s { font-size: 12px; color: var(--sub); transition: color .25s; }
  .act .e { font-size: 20px; line-height: 1; transition: transform .4s var(--ease); }
  .act.on { background: linear-gradient(135deg, #0a84ff, #5e5ce6); box-shadow: 0 6px 20px rgba(10, 132, 255, .3); }
  .act.on .s { color: rgba(255, 255, 255, .85); }
  .act.on .e { transform: rotate(-12deg) scale(1.15); }

  .regen { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 46px; margin-top: 10px;
    border-radius: 14px; background: transparent; border: 1px solid var(--line); color: var(--sub); font-size: 14px; font-weight: 600; }
  .regen .spin { display: inline-block; transition: transform .6s var(--ease); }
  .regen.go .spin { transform: rotate(360deg); }

  /* 设置弹层 */
  .mask { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 760px; margin: 0 auto;
    background: #1c1c1f; border-radius: 22px 22px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .45s var(--ease); max-height: 88vh; overflow: auto; }
  .sheet-open .mask { opacity: 1; pointer-events: auto; }
  .sheet-open .sheet { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: #48484e; margin: 2px auto 10px; }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { color: var(--accent); font-size: 16px; font-weight: 600; padding: 6px 4px; }
  .sheet label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 6px; }
  .sheet input, .sheet select { width: 100%; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .sheet input:focus, .sheet select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10, 132, 255, .25); }
  .row { display: flex; gap: 8px; } .row select { flex: 1; min-width: 0; }
  .small-btn { flex: none; height: 46px; padding: 0 14px; border-radius: 12px; background: var(--card2); font-size: 14px; font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chips button { padding: 6px 12px; border-radius: 99px; background: var(--card2); font-size: 13px; color: var(--sub); }
  .chips button.on { background: rgba(10, 132, 255, .2); color: var(--accent); }
  .hint { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
  .hint a { color: var(--accent); }

  /* 提示 toast */
  #toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 30; max-width: calc(100% - 32px);
    padding: 11px 16px; border-radius: 14px; background: rgba(44, 44, 48, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .4); pointer-events: none;
    opacity: 0; transform: translate(-50%, 20px) scale(.96); transition: opacity .3s var(--ease), transform .4s var(--ease); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes pop { 0% { transform: scaleY(.4); filter: brightness(1.8); } 100% { transform: none; filter: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>边看边出字幕</h1>
  <button class="icon-btn press" id="openSettings" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span class="dot" id="keyDot" hidden></span>
  </button>
</header>

<div class="wrap" id="app">
  <label class="pick press">
    <span class="ico">🎬</span>
    <div><b id="pickTitle">选一个本地视频</b><small id="pickSub">MP4 / MOV 最快，几 GB 也能秒开</small></div>
    <span class="chg">换一个</span>
    <input id="file" type="file" accept="video/*,audio/*">
  </label>

  <div class="player"><video id="video" controls playsinline></video></div>

  <div class="card reveal d1">
    <div class="prog-top"><b>字幕进度</b><span id="count">0 / 0</span></div>
    <div id="map" title="点一下跳到那里"><span id="head"></span></div>
    <div id="status"></div>
    <button class="retry press" id="retryBtn"><span class="spin">🔁</span> <span id="retryTxt">重试失败的段</span></button>
    <div class="legend"><span><em style="background:var(--green)"></em>已完成</span><span><em style="background:var(--accent)"></em>识别中</span><span><em style="background:#2a2a2f"></em>待识别</span><span><em style="background:var(--red)"></em>失败</span></div>
  </div>

  <div class="card reveal d2">
    <div class="label">字幕显示</div>
    <div class="seg" id="modes">
      <span class="thumb"></span>
      <button data-mode="both" class="on">原文 + 翻译</button>
      <button data-mode="tr">只看翻译</button>
      <button data-mode="src">只看原文</button>
    </div>
  </div>

  <div class="actions reveal d3">
    <button class="act press" id="fullBtn"><span class="e">⚡</span><span class="t">全部生成</span><span class="s">不用边看边等</span></button>
    <button class="act press" id="srtBtn"><span class="e">💾</span><span class="t">导出 SRT</span><span class="s">存成字幕文件</span></button>
  </div>
  <button class="regen press reveal d3" id="regenBtn"><span class="spin">🔄</span> 重新生成字幕</button>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="settings" role="dialog" aria-label="设置">
  <div class="grab"></div>
  <h2>设置 <button id="closeSettings">完成</button></h2>
  <label>Gemini API Key</label>
  <input id="key" type="password" autocomplete="off" placeholder="AIza...">
  <div class="hint">只存在这台设备的浏览器里。没有的话去 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 免费申请一个。</div>
  <label>模型</label>
  <div class="row">
    <select id="model"></select>
    <button class="small-btn press" id="loadModels">刷新列表</button>
  </div>
  <label>翻译成</label>
  <input id="lang" type="text" value="简体中文">
  <div class="chips" id="langChips">
    <button>简体中文</button><button>繁體中文</button><button>English</button><button>日本語</button><button>한국어</button>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const CH = 30;          // 每段秒数
  const AHEAD = 10;       // 最多提前识别几段（10 段 = 5 分钟）
  const WORKERS = 2;      // 同时请求数
  const TARGET_SR = 16000;

  const $ = id => document.getElementById(id);
  const video = $('video'), statusEl = $('status');
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // ---------- 设置 ----------
  const keyEl = $('key'), modelEl = $('model'), langEl = $('lang');
  keyEl.value = ls.get('sub_key') || '';
  langEl.value = ls.get('sub_lang') || '简体中文';
  keyEl.onchange = () => ls.set('sub_key', keyEl.value.trim());
  langEl.onchange = () => { ls.set('sub_lang', langEl.value.trim()); syncChips(); };

  // 设置弹层
  const openSheet = () => { document.body.classList.add('sheet-open'); };
  const closeSheet = () => {
    document.body.classList.remove('sheet-open');
    keyEl.onchange(); langEl.onchange();
    $('keyDot').hidden = !!keyEl.value.trim();
  };
  $('openSettings').onclick = openSheet;
  $('closeSettings').onclick = closeSheet;
  $('mask').onclick = closeSheet;
  // 下滑关闭
  (() => {
    const sh = $('settings'); let y0 = null, dy = 0;
    sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
    sh.addEventListener('touchmove', e => {
      if (y0 == null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
    }, { passive: true });
    sh.addEventListener('touchend', () => {
      if (y0 == null) return;
      sh.style.transition = ''; sh.style.transform = '';
      if (dy > 90) closeSheet();
      y0 = null;
    });
  })();
  function syncChips() {
    document.querySelectorAll('#langChips button').forEach(b => b.classList.toggle('on', b.textContent === langEl.value.trim()));
  }
  document.querySelectorAll('#langChips button').forEach(b => b.onclick = () => { langEl.value = b.textContent; langEl.onchange(); });
  syncChips();
  $('keyDot').hidden = !!keyEl.value;
  if (!keyEl.value) setTimeout(openSheet, 350);

  // toast
  let toastT = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function setModels(list, preferred) {
    modelEl.innerHTML = '';
    list.forEach(m => {
      const o = document.createElement('option');
      o.value = o.textContent = m;
      modelEl.appendChild(o);
    });
    if (preferred && list.includes(preferred)) modelEl.value = preferred;
  }
  const savedModel = ls.get('sub_model');
  setModels(savedModel ? [savedModel] : ['gemini-3.6-flash'], savedModel);
  modelEl.onchange = () => ls.set('sub_model', modelEl.value);

  $('loadModels').onclick = async () => {
    const key = keyEl.value.trim();
    if (!key) return setStatus('先填 API Key', true);
    setStatus('获取模型列表…');
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || r.status);
      const names = (j.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => m.name.replace(/^models\//, ''))
        .filter(n => /gemini/.test(n) && !/(tts|image|embed|live|audio)/.test(n))
        .sort().reverse();
      const flash = names.find(n => /flash$/.test(n)) || names[0];
      setModels(names, ls.get('sub_model') || flash);
      ls.set('sub_model', modelEl.value);
      setStatus('模型列表已更新');
    } catch (e) { setStatus('获取失败：' + e.message, true); }
  };

  // ---------- 显示模式 ----------
  let mode = ls.get('sub_mode') || 'both';
  const modeBtns = [...document.querySelectorAll('#modes button')], thumb = document.querySelector('#modes .thumb');
  function moveThumb() {
    const b = modeBtns.find(x => x.dataset.mode === mode) || modeBtns[0];
    thumb.style.width = b.offsetWidth + 'px';
    thumb.style.transform = `translateX(${b.offsetLeft - 3}px)`;
  }
  modeBtns.forEach(b => {
    b.classList.toggle('on', b.dataset.mode === mode);
    b.onclick = () => {
      if (mode === b.dataset.mode) return;
      mode = b.dataset.mode; ls.set('sub_mode', mode);
      modeBtns.forEach(x => x.classList.toggle('on', x === b));
      moveThumb();
      rebuildCues();
    };
  });
  addEventListener('resize', moveThumb);
  requestAnimationFrame(moveThumb);

  let lastMsg = '';
  function setStatus(msg, err) {
    if (msg !== lastMsg && msg.split(' · ')[0] !== lastMsg.split(' · ')[0]) {
      statusEl.classList.remove('flash'); void statusEl.offsetWidth; statusEl.classList.add('flash');
    }
    lastMsg = msg;
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!err);
  }

  // ---------- 分段进度条（每格一段，点一下跳过去） ----------
  const mapEl = $('map'), headEl = $('head'), countEl = $('count');
  let cells = [];
  function buildMap() {
    cells.forEach(c => c.remove());
    cells = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < nChunks; i++) { const c = document.createElement('i'); cells.push(c); frag.appendChild(c); }
    mapEl.insertBefore(frag, headEl);
    cells.forEach((c, i) => { c.className = 's' + (state[i] || 0); });
    renderCount(); moveHead();
  }
  function paint(i) {
    const c = cells[i]; if (!c) return;
    const cls = 's' + state[i];
    if (c.className.startsWith(cls)) return;
    c.className = cls + (state[i] === 2 ? ' pop' : '');
    renderCount();
  }
  function renderCount() {
    const done = state.filter(s => s === 2).length;
    countEl.textContent = `${done} / ${nChunks} 段`;
    const failed = state.filter(s => s === 3).length;
    $('retryBtn').classList.toggle('show', failed > 0);
    if (failed) $('retryTxt').textContent = `重试失败的 ${failed} 段`;
  }
  function retry(list) {
    list.forEach(k => { state[k] = 0; tries[k] = 0; paint(k); });
    renderCount();
  }
  $('retryBtn').onclick = () => {
    const list = [];

    b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');

    toast(`🔁 ${list.length} 段重新排队了`);
  };
  function moveHead() {
    const d = video.duration || nChunks * CH;
    headEl.style.left = d ? Math.min(100, (video.currentTime || 0) / d * 100) + '%' : '0';
  }
  video.addEventListener('timeupdate', moveHead);
  mapEl.addEventListener('click', e => {
    if (!video.duration) return;

    const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));

    const fail = [];
    for (let k = lo; k <= hi; k++) if (state[k] === 3) fail.push(k);

  let track = null;

  function cueText(s) {

    fullBtn.querySelector('.e').textContent = fullMode ? '⏸' : '⚡';
    fullBtn.querySelector('.t').textContent = fullMode ? '正在全部生成' : '全部生成';
    fullBtn.querySelector('.s').textContent = fullMode ? '点一下改回跟着播放做' : '不用边看边等';
    toast(fullMode ? '⚡ 后台把整部片都生成好' : '⏸ 改成只跟着播放进度生成');
    if (nChunks) updateProgress();

  $('srtBtn').onclick = () => {
    const all = segs.flat().sort((a, b) => a.start - b.start);

    if (my !== session) return;

  let mp4 = null;

  const readDV = async (file, a, b) => new DataView(await file.slice(a, b).arrayBuffer());

  // 只读顶层 box 头，找到 moov 后只把 moov 读进来（通常几 MB）
  async function openMp4Audio(file) {
    let off = 0, moov = null, first = true;

      { const ec = u32(t.stsc.s + 4); let k = 0;

  }

  // 第 i 段：直接拼出 AAC(ADTS)/MP3 帧，File.slice 是惰性的，不会把整个视频读进内存
  function mp4Chunk(i) {

    const lb = x => { let lo = 0, hi = m.n; while (lo < hi) { const mid = (lo + hi) >> 1; if (m.time(mid) < x) lo = mid + 1; else hi = mid; } return lo; };
    const a = lb(t0), b = lb(t1);

  // ---------- 静音检测：防止 Gemini 对着没声音的音频编台词 ----------
  const SILENT = 0.006;   // 50ms 窗口 RMS 低于这个当作没声音（约 -44 dBFS）
  const WIN = 0.05;
  function levelsOf(arr, rate, s0, s1, scale) {

    for (let k = 0; k < n; k++) {

      for (let j = a; j < b; j++) { const v = arr[j] / scale; sum += v * v; }
      out[k] = Math.sqrt(sum / Math.max(1, b - a));

    const a = Math.max(0, Math.floor(t0 / WIN)), b = Math.min(lv.length, Math.ceil(t1 / WIN));
    for (let k = a; k < b; k++) if (lv[k] > m) m = lv[k];

  // 拿到这一段的音量曲线；解码不了就返回 null（不做检测，照常识别）
  async function chunkLevels(i, piece) {

  // MP4 段解码成 16k 单声道：拿来测音量，也拿来生成标准 WAV 发给 Gemini（比直接发 AAC 稳）
  async function decodeChunk(piece) {
    if (piece.decoded !== undefined) return piece.decoded;
    piece.decoded = null;
    try {
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const ctx = new OAC(1, 1, TARGET_SR);
      const buf = await piece.blob.arrayBuffer();
      const ab = await new Promise((res, rej) => {
        const p = ctx.decodeAudioData(buf, res, rej);
        if (p && p.then) p.then(res, rej);
      });
      const d0 = ab.getChannelData(0), n = ab.length;
      let mono = d0;
      if (ab.numberOfChannels > 1) {
        mono = new Float32Array(n);
        for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let k = 0; k < n; k++) mono[k] += d[k] / ab.numberOfChannels; }
      }
      piece.decoded = { lv: levelsOf(mono, ab.sampleRate, 0, n, 1), mono, rate: ab.sampleRate };
      return piece.decoded;
    } catch (e) { return null; }
  }

  async function decode(buf) {
    let ctx;
    try { ctx = new AudioContext({ sampleRate: TARGET_SR }); }
    catch (e) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    try {
      return await new Promise((res, rej) => {
        const p = ctx.decodeAudioData(buf, res, rej);
        if (p && p.then) p.then(res, rej);
      });
    } finally { try { ctx.close(); } catch (e) {} }
  }

  function toMonoInt16(ab) {
    const n = ab.length, chs = ab.numberOfChannels;
    const out = new Int16Array(n);
    const data = [];
    for (let c = 0; c < chs; c++) data.push(ab.getChannelData(c));
    for (let i = 0; i < n; i++) {
      let v = 0;
      for (let c = 0; c < chs; c++) v += data[c][i];
      v /= chs;
      out[i] = v > 1 ? 32767 : v < -1 ? -32768 : v * 32767;
    }
    return out;
  }

  function wavFromFloat(mono, rate) {
    const ratio = rate / TARGET_SR, len = Math.floor(mono.length / ratio);
    const view = new DataView(new ArrayBuffer(44 + len * 2));
    const w = (o, s) => { for (let k = 0; k < s.length; k++) view.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, TARGET_SR, true); view.setUint32(28, TARGET_SR * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true); w(36, 'data'); view.setUint32(40, len * 2, true);
    for (let k = 0; k < len; k++) {
      const v = mono[Math.floor(k * ratio)];
      view.setInt16(44 + k * 2, v > 1 ? 32767 : v < -1 ? -32768 : v * 32767, true);
    }
    return new Blob([view.buffer], { type: 'audio/wav' });
  }

  // 取第 i 段，降到 16k，打包成 wav
  function chunkWav(i) {
    const s0 = Math.floor(i * CH * sr), s1 = Math.min(pcm.length, Math.floor((i + 1) * CH * sr));
    const ratio = sr / TARGET_SR;
    const len = Math.floor((s1 - s0) / ratio);
    const view = new DataView(new ArrayBuffer(44 + len * 2));
    const w = (o, s) => { for (let k = 0; k < s.length; k++) view.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, TARGET_SR, true); view.setUint32(28, TARGET_SR * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true); w(36, 'data'); view.setUint32(40, len * 2, true);
    for (let k = 0; k < len; k++) view.setInt16(44 + k * 2, pcm[s0 + Math.floor(k * ratio)], true);
    return { blob: new Blob([view.buffer], { type: 'audio/wav' }), mime: 'audio/wav', dur: (s1 - s0) / sr, base: i * CH };
  }

  function blobToB64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }

  // ---------- 调度：优先当前播放位置 ----------
  function pickNext() {
    const cur = Math.floor((video.currentTime || 0) / CH);
    for (let i = cur; i < Math.min(nChunks, cur + AHEAD); i++) if (state[i] === 0) return i;
    if (fullMode) {
      for (let i = cur; i < nChunks; i++) if (state[i] === 0) return i;
      for (let i = 0; i < cur; i++) if (state[i] === 0) return i;
    }
    return -1;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function worker(my) {
    while (my === session) {
      const i = pickNext();
      if (i < 0) { await sleep(600); continue; }
      state[i] = 1; paint(i);
      try {
        const list = await recognize(i);
        if (my !== session) return;
        segs[i] = list;
        list.forEach(addCue);
        state[i] = 2; paint(i);
        saveCache();
        updateProgress();
      } catch (err) {
        if (my !== session) return;
        tries[i]++;
        state[i] = tries[i] >= 3 ? 3 : 0; paint(i);
        setStatus(`第 ${i + 1} 段出错：${err.message}` + (state[i] === 3 ? '（已跳过，可以点下面的按钮重试）' : '（稍后重试）'), true);
        await sleep(err.retryAfter || 3000);
      }
    }
  }

  function updateProgress() {
    const done = state.filter(s => s >= 2).length;
    renderCount();
    if (done === nChunks) {
      const skipped = state.filter(s => s === 3).length;
      return setStatus(skipped ? `生成完毕，有 ${skipped} 段出错跳过了` : '✅ 全部字幕生成好了，下次选同一个视频会直接挂上');
    }
    let k = Math.floor((video.currentTime || 0) / CH);
    while (k < nChunks && state[k] >= 2) k++;
    const t = Math.min(k * CH, video.duration || k * CH);
    setStatus(`已识别 ${done}/${nChunks} 段 · 字幕已覆盖到 ${fmt(t)}`);
  }
  const fmt = s => { s = Math.floor(s); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; };

  // ---------- 调 Gemini ----------
  async function recognize(i) {
    const key = keyEl.value.trim();
    if (!key) { const e = new Error('还没填 API Key'); e.retryAfter = 5000; throw e; }
    const model = modelEl.value;
    const lang = langEl.value.trim() || '简体中文';
    const piece = mp4 ? mp4Chunk(i) : chunkWav(i);
    if (!piece || piece.dur <= 0.05) return [];
    let { blob, dur, mime, base } = piece;
    const lv = await chunkLevels(i, piece);
    if (lv && maxLevel(lv) < SILENT) return []; // 整段静音，不用问 Gemini
    if (mp4 && piece.decoded) { blob = wavFromFloat(piece.decoded.mono, piece.decoded.rate); mime = 'audio/wav'; }
    const b64 = await blobToB64(blob);

    const prev = (segs[i - 1] || []).slice(-3).map(s => s.text).join(' / ');
    const prompt =
`这是视频里的一段音频，长约 ${dur.toFixed(1)} 秒。
请把里面所有人声对白逐句转写成原语言文字（text），并给每句附上${lang}翻译（tr）；如果原文已经是${lang}，tr 和 text 相同。
start / end 是这句话在这段音频里的开始和结束秒数（相对本段，0 到 ${dur.toFixed(1)} 之间，保留一位小数）。
每句控制在一行字幕的长度，长句拆开。
没有人声（纯音乐、静音、环境声、噪音）就必须返回空数组 []。
绝对不要编造：只输出这段音频里真实听到的话，不要补充任何常见的电影台词、客套话、片头片尾字幕或"感谢观看"之类的内容。` +
      (prev ? `\n上一段结尾的台词（仅供理解语境，不要重复输出）：${prev}` : '');

    const body = {
      contents: [{ parts: [
        { inline_data: { mime_type: mime, data: b64 } },
        { text: prompt }
      ] }],
      generationConfig: {
        temperature: 0,
        responseMimeType: 'application/json',
        responseSchema: {
          type: 'ARRAY',
          items: {
            type: 'OBJECT',
            properties: {
              start: { type: 'NUMBER' }, end: { type: 'NUMBER' },
              text: { type: 'STRING' }, tr: { type: 'STRING' }
            },
            required: ['start', 'end', 'text', 'tr']
          }
        }
      }
    };

    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(j.error?.message || ('HTTP ' + r.status));
      if (r.status === 429) e.retryAfter = 15000;
      throw e;
    }
    const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    let arr;
    try { arr = JSON.parse(txt); } catch (e) { throw new Error('返回内容解析失败'); }
    if (!Array.isArray(arr)) arr = [];

    return arr
      .filter(s => s && s.text)
      .map(s => {
        let a = Math.max(0, Math.min(dur, +s.start || 0));
        let b = Math.max(0, Math.min(dur, +s.end || 0));
        if (b <= a) b = Math.min(dur, a + 2);
        return { a, b, start: base + a, end: base + b, text: String(s.text).trim(), tr: String(s.tr || '').trim() };
      })
      // 落在静音位置的字幕是编出来的，丢掉（前后留 0.3 秒余量，时间戳不一定准）
      .filter(s => !lv || maxLevel(lv, s.a - 0.3, s.b + 0.3) >= SILENT)
      .map(({ a, b, ...s }) => s);
  }

  video.addEventListener('seeked', () => { if (nChunks) updateProgress(); });
})();
</script>
</body>
</html>
