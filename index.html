<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>边看边出字幕</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0d; --card: #17171a; --card2: #222226; --line: #2c2c31;
    --text: #f2f2f4; --sub: #9a9aa3; --accent: #0a84ff; --green: #30d158; --red: #ff5f57; --amber: #ffb340;
    --r: 16px; --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: rgba(11, 11, 13, .78); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--card2);
    transition: transform .25s var(--ease), background .2s; position: relative; }
  .icon-btn svg { width: 20px; height: 20px; transition: transform .5s var(--ease); }
  .icon-btn:active svg { transform: rotate(60deg); }
  .icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--red);
    box-shadow: 0 0 0 2px var(--card2); animation: pulse 1.6s infinite; }

  .wrap { padding: 4px 16px 40px; max-width: 760px; margin: 0 auto; }

  /* 按压回弹 */
  .press { transition: transform .18s var(--ease), background .25s, color .25s, box-shadow .25s; }
  .press:active { transform: scale(.96); }

  /* 选视频 */
  .pick { display: flex; align-items: center; gap: 14px; padding: 18px; margin-top: 8px; border-radius: var(--r);
    background: var(--card); border: 1.5px dashed #3a3a40; cursor: pointer; }
  .pick input { display: none; }
  .pick .ico { width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, #0a84ff, #5e5ce6); }
  .pick b { display: block; font-size: 16px; }
  .pick small { color: var(--sub); font-size: 13px; }
  .has-video .pick { padding: 10px 12px; border-style: solid; border-color: transparent; }
  .has-video .pick .ico { width: 36px; height: 36px; font-size: 18px; border-radius: 10px; }
  .has-video .pick b { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick > div { min-width: 0; flex: 1; }
  .pick .chg { font-size: 13px; color: var(--accent); font-weight: 600; flex: none; display: none; }
  .has-video .pick .chg { display: block; }

  /* 视频 */
  .player { margin-top: 12px; border-radius: var(--r); overflow: hidden; background: #000;
    max-height: 0; opacity: 0; transform: translateY(8px) scale(.98);
    transition: max-height .6s var(--ease), opacity .45s var(--ease), transform .5s var(--ease); }
  .has-video .player { max-height: 80vh; opacity: 1; transform: none; }
  video { width: 100%; display: block; background: #000; max-height: 70vh; }
  video::cue { font-size: .9em; background: rgba(0, 0, 0, .6); }

  /* 音频模式：大字显示当前这句 + 细长播放条 */
  /* 音频模式：背景图 + 大字当前句 + 自制播放条（不用系统播放条，避免样式打架） */
  .now { display: none; }
  .is-audio video { display: none; }
  .is-audio .player { background: #111; }
  .is-audio .now { display: flex; flex-direction: column; position: relative; height: clamp(320px, 56vh, 480px); isolation: isolate;
    user-select: none; -webkit-user-select: none; }
  .art, .shade { position: absolute; inset: 0; z-index: -1; }
  .art { background:
      radial-gradient(70% 60% at 15% 15%, #ff6a88 0%, transparent 60%),
      radial-gradient(70% 60% at 90% 30%, #7a5cff 0%, transparent 60%),
      radial-gradient(80% 70% at 40% 95%, #00b3ff 0%, transparent 60%),
      linear-gradient(135deg, #5b2bd6, #1e3bd1) center / cover no-repeat;
    background-size: cover; background-position: center; filter: saturate(1.25) contrast(1.04);
    transition: opacity .6s var(--ease); animation: drift 38s ease-in-out infinite alternate; animation-play-state: paused; }
  .playing .art { animation-play-state: running; }
  .art.fade { opacity: 0; }
  .shade { background:
    radial-gradient(80% 26% at 50% 48%, rgba(0,0,0,.16), transparent 80%),
    linear-gradient(to bottom, rgba(0,0,0,.22) 0%, transparent 16%, transparent 56%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.72) 100%); }
  @keyframes drift { from { transform: scale(1.04); } to { transform: scale(1.14) translate(-2%, -1.5%); } }

  /* 播放中一段时间不操作：控件淡出，只留背景和字幕 */
  .now-top, .ctrl { transition: opacity .6s var(--ease), transform .6s var(--ease); }
  .shade { transition: opacity .8s var(--ease); }
  .lyric { transition: transform .7s var(--ease); }
  .calm .now-top { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  .calm .ctrl { opacity: 0; transform: translateY(12px); pointer-events: none; }
  .calm .shade { opacity: .35; }
  .calm .lyric { transform: translateY(24px); }
  .now-top { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 12px 0; }
  .glass { white-space: nowrap; height: 34px; min-width: 34px; padding: 0 10px; border-radius: 99px; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 13px; font-weight: 600; color: #fff; background: rgba(255,255,255,.14);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); }
  .glass svg { width: 17px; height: 17px; }
  .glass[hidden] { display: none; }
  .bg-in { display: none; }

  .lyric { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 22px; text-align: center; min-height: 0; }
  .lyric p { margin: 0; text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 2px 10px rgba(0,0,0,.55), 0 6px 30px rgba(0,0,0,.45); transition: opacity .3s var(--ease), transform .45s var(--ease), filter .3s; }
  #nowSrc { font-size: 22px; font-weight: 700; line-height: 1.45; }
  #nowTr { font-size: 15px; color: rgba(255,255,255,.78); margin-top: 8px; line-height: 1.5; min-height: 1.5em; }
  .lyric.swap p { opacity: 0; transform: translateY(8px); filter: blur(3px); }
  .lyric.dim p { opacity: .5; }

  .ctrl { padding: 0 18px 16px; }
  .seek { position: relative; height: 28px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .seek .rail { position: relative; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); overflow: hidden;
    transition: height .2s var(--ease); }
  .seek .fill { position: absolute; inset: 0; background: #fff; transform-origin: left; transform: scaleX(0); will-change: transform; }
  .seek .knob { position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); transform: scale(0); transition: transform .2s var(--ease); will-change: left; pointer-events: none; }
  .seek:hover .knob, .seek.drag .knob { transform: scale(1); }
  .seek.drag .rail { height: 7px; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,.7); font-variant-numeric: tabular-nums; margin-top: -2px; }
  .btns { display: grid; grid-template-columns: 1fr auto auto auto 1fr; align-items: center; gap: 14px; margin-top: 6px; }
  .btns .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .btns .ic svg { width: 26px; height: 26px; }
  .btns .ic:active { background: rgba(255,255,255,.12); }
  .btns .pp { width: 62px; height: 62px; background: #fff; color: #111; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .btns .pp:active { background: #e8e8e8; }
  .pp svg { width: 28px; height: 28px; position: absolute; transition: opacity .2s, transform .3s var(--ease); }
  .pp { position: relative; }
  .pp .i-pause { opacity: 0; transform: scale(.6) rotate(-30deg); }
  .playing .pp .i-play { opacity: 0; transform: scale(.6) rotate(30deg); }
  .playing .pp .i-pause { opacity: 1; transform: none; }
  .speed, .listbtn { width: 46px; height: 34px; padding: 0; }
  .speed { justify-self: start; }
  .listbtn { justify-self: end; }

  /* 进入动画：选完视频后控制区依次浮现 */
  .reveal { opacity: 0; transform: translateY(14px); pointer-events: none;
    transition: opacity .45s var(--ease), transform .55s var(--ease); }
  body:not(.has-video) .reveal { display: none; }
  .shown .reveal { opacity: 1; transform: none; pointer-events: auto; }
  .d1 { transition-delay: .12s !important; } .d2 { transition-delay: .2s !important; } .d3 { transition-delay: .28s !important; }

  .card { background: var(--card); border-radius: var(--r); padding: 14px; margin-top: 12px; }

  /* 进度卡 */
  .prog-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .prog-top b { font-size: 15px; }
  .prog-top span { color: var(--sub); font-size: 13px; font-variant-numeric: tabular-nums; }
  #map { position: relative; display: flex; gap: 2px; height: 22px; margin: 12px 0 10px; border-radius: 6px; overflow: hidden; cursor: pointer; touch-action: manipulation; }
  #map i { flex: 1; min-width: 1px; background: #2a2a2f; transition: background .5s var(--ease); }
  #map i.s1 { background: var(--accent); animation: breathe 1.1s ease-in-out infinite; }
  #map i.s2 { background: var(--green); }
  #map i.s3 { background: var(--red); }
  #map i.pop { animation: pop .5s var(--ease); }
  #head { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #fff;
    box-shadow: 0 0 6px rgba(255, 255, 255, .7); left: 0; transition: left .3s linear; pointer-events: none; }
  #status { font-size: 13px; color: var(--sub); min-height: 1.4em; white-space: pre-wrap; line-height: 1.5; transition: color .3s; }
  #status.err { color: var(--red); }
  #status.flash { animation: fadeUp .35s var(--ease); }
  .retry { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border-radius: 12px;
    background: rgba(255, 95, 87, .14); color: var(--red); font-size: 14px; font-weight: 600;
    max-height: 0; margin: 0; opacity: 0; overflow: hidden; pointer-events: none;
    transition: max-height .4s var(--ease), margin .4s var(--ease), opacity .3s, transform .18s var(--ease); }
  .retry.show { max-height: 44px; height: 44px; margin: 10px 0 2px; opacity: 1; pointer-events: auto; }
  .retry .spin { display: inline-block; transition: transform .6s var(--ease); }
  .retry.go .spin { transform: rotate(360deg); }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--sub); margin-top: 8px; flex-wrap: wrap; }
  .legend em { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; font-style: normal; }

  /* 字幕列表 */
  .lyr-wrap { position: relative; margin-top: 10px; }
  #lyr { position: relative; height: min(42vh, 360px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
    margin: 0 -6px; padding: 4px 0 40% ;
    -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18px, #000 calc(100% - 28px), transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 18px, #000 calc(100% - 28px), transparent); }
  .lyr-empty { color: var(--sub); font-size: 13px; text-align: center; padding: 48px 12px; line-height: 1.8; }
  .ln { display: flex; gap: 10px; padding: 9px 10px; border-radius: 12px; cursor: pointer; opacity: .55;
    transition: opacity .35s var(--ease), background .35s var(--ease), transform .35s var(--ease); transform-origin: left center; }
  .ln:active { background: var(--card2); }
  .ln time { flex: none; width: 44px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; padding-top: 3px; }
  .ln div { min-width: 0; flex: 1; }
  .ln p { margin: 0; font-size: 15px; line-height: 1.45; word-break: break-word; }
  .ln p + p { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .ln.past { opacity: .4; }
  .ln.on { opacity: 1; background: rgba(10, 132, 255, .14); transform: scale(1.015); }
  .ln.on time { color: var(--accent); font-weight: 600; }
  .ln.on p + p { color: #c9c9d1; }
  .ln.new { animation: lnIn .5s var(--ease) both; }
  .follow { position: absolute; right: 6px; bottom: 6px; padding: 8px 12px; border-radius: 99px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(10, 132, 255, .4);
    opacity: 0; transform: translateY(10px) scale(.9); pointer-events: none; transition: opacity .25s, transform .35s var(--ease); }
  .follow.show { opacity: 1; transform: none; pointer-events: auto; }
  @keyframes lnIn { from { opacity: 0; transform: translateY(8px); } }

  /* 分段切换：滑块 */
  .seg { position: relative; display: flex; padding: 3px; border-radius: 12px; background: var(--card2); }
  .seg button { position: relative; z-index: 1; flex: 1; height: 38px; font-size: 14px; font-weight: 600; color: var(--sub); transition: color .3s; }
  .seg button.on { color: #fff; }
  .seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 9px; background: var(--accent);
    box-shadow: 0 2px 10px rgba(10, 132, 255, .45); transition: transform .42s var(--ease), width .42s var(--ease); }
  .label { font-size: 12px; color: var(--sub); margin: 0 2px 8px; font-weight: 600; letter-spacing: .5px; }


  /* 设置弹层 */
  .mask { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 760px; margin: 0 auto;
    background: #1c1c1f; border-radius: 22px 22px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .45s var(--ease); max-height: 88vh; overflow: auto; }
  .mask.open { opacity: 1; pointer-events: auto; }
  .sheet.open { transform: none; }
  .hd-btns { display: flex; gap: 10px; }
  #openTools { opacity: 0; transform: scale(.6); pointer-events: none; transition: opacity .3s, transform .45s var(--ease); }
  .has-video #openTools { opacity: 1; transform: none; pointer-events: auto; }
  .pill { font-style: normal; font-size: 11px; font-weight: 700; color: #ff9f0a; background: rgba(255,159,10,.15); padding: 2px 8px;
    border-radius: 99px; margin-left: 6px; vertical-align: 2px; display: inline-block; opacity: 0; transform: scale(.7); transition: opacity .25s, transform .35s var(--ease); }
  .full-on .pill { opacity: 1; transform: none; }

  /* 选项列表（iOS 分组样式） */
  .group { margin-top: 18px; background: var(--card2); border-radius: 14px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; position: relative; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 1px; background: var(--line); }
  .item:active { background: #2e2e33; transform: none; }
  .badge { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; }
  .badge svg { width: 18px; height: 18px; }
  .txt { flex: 1; min-width: 0; }
  .txt b { display: block; font-size: 16px; font-weight: 600; }
  .txt small { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; transition: color .2s; }
  .chev { flex: none; width: 18px; height: 18px; color: #5a5a62; }
  .danger b { color: var(--red); }
  .danger.arm { background: rgba(255,95,87,.12); }
  .danger.arm small { color: var(--red); }
  .danger .spin { transition: transform .6s var(--ease); }
  .danger.go .spin { transform: rotate(360deg); }
  .sw { flex: none; width: 51px; height: 31px; border-radius: 99px; background: #39393d; position: relative; transition: background .3s var(--ease); }
  .sw i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .35s var(--ease); }
  .full-on .sw { background: var(--green); }
  .full-on .sw i { transform: translateX(20px); }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: #48484e; margin: 2px auto 10px; }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { color: var(--accent); font-size: 16px; font-weight: 600; padding: 6px 4px; }
  .sheet label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 6px; }
  .sheet input, .sheet select { width: 100%; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); font-size: 16px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .sheet input:focus, .sheet select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10, 132, 255, .25); }
  .row { display: flex; gap: 8px; } .row select { flex: 1; min-width: 0; }
  .small-btn { flex: none; height: 46px; padding: 0 14px; border-radius: 12px; background: var(--card2); font-size: 14px; font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chips button { padding: 6px 12px; border-radius: 99px; background: var(--card2); font-size: 13px; color: var(--sub); }
  .chips button.on { background: rgba(10, 132, 255, .2); color: var(--accent); }
  .hint { font-size: 12px; color: var(--sub); margin-top: 8px; line-height: 1.5; }
  .hint a { color: var(--accent); }

  /* 提示 toast */
  #toast { position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); z-index: 30; max-width: calc(100% - 32px);
    padding: 11px 16px; border-radius: 14px; background: rgba(44, 44, 48, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 14px; box-shadow: 0 8px 30px rgba(0, 0, 0, .4); pointer-events: none;
    opacity: 0; transform: translate(-50%, 20px) scale(.96); transition: opacity .3s var(--ease), transform .4s var(--ease); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes pop { 0% { transform: scaleY(.4); filter: brightness(1.8); } 100% { transform: none; filter: none; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>边看边出字幕</h1>
  <div class="hd-btns">
  <button class="icon-btn press" id="openTools" aria-label="字幕选项">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 15h4M14 15h3M7 11h2M12 11h5"/></svg>
  </button>
  <button class="icon-btn press" id="openSettings" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span class="dot" id="keyDot" hidden></span>
  </button>
  </div>
</header>

<div class="wrap" id="app">
  <label class="pick press">
    <span class="ico" id="pickIco">🎬</span>
    <div><b id="pickTitle">选一个本地视频或音频</b><small id="pickSub">MP4 / MOV / M4A 最快，几 GB 也能秒开</small></div>
    <span class="chg">换一个</span>
    <input id="file" type="file"><!-- 故意不写 accept：iOS 对 audio/* 过滤有 bug，文件 App 里的音频会变灰选不了 -->
  </label>

  <div class="player">
    <div class="now" id="now">
      <div class="art" id="art"></div><div class="shade"></div>
      <div class="now-top">
        <button class="glass press" id="bgDel" hidden aria-label="去掉背景图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <label class="glass press" aria-label="换背景图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          <span>背景</span><input class="bg-in" id="bgIn" type="file" accept="image/*"></label>
      </div>
      <div class="lyric" id="lyric"><p id="nowSrc"></p><p id="nowTr"></p></div>
      <div class="ctrl">
        <div class="seek" id="seek"><div class="rail"><div class="fill" id="fill"></div></div><div class="knob" id="knob"></div></div>
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
        <div class="btns">
          <button class="glass press speed" id="speedBtn">1×</button>
          <button class="ic press" id="prevBtn" aria-label="上一句"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 6.5v11a1 1 0 0 1-1.5.86l-9-5.5a1 1 0 0 1 0-1.72l9-5.5A1 1 0 0 1 20 6.5z"/></svg></button>
          <button class="ic pp press" id="ppBtn" aria-label="播放/暂停">
            <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6v12.8a1 1 0 0 0 1.52.85l10.4-6.4a1 1 0 0 0 0-1.7L9.52 4.75A1 1 0 0 0 8 5.6z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
          </button>
          <button class="ic press" id="nextBtn" aria-label="下一句"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 6.5v11a1 1 0 0 0 1.5.86l9-5.5a1 1 0 0 0 0-1.72l-9-5.5A1 1 0 0 0 4 6.5z"/></svg></button>
          <button class="glass press listbtn" id="listBtn" aria-label="字幕列表"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h7M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></button>
        </div>
      </div>
    </div>
    <video id="video" controls playsinline></video>
  </div>

  <div class="card reveal d1 lyr-card">
    <div class="prog-top"><b>字幕列表</b><span id="lyrCount">0 句</span></div>
    <div class="lyr-wrap">
      <div id="lyr"><div class="lyr-empty">字幕生成出来后会按时间出现在这里<br>点任意一句，视频就跳过去</div></div>
      <button class="follow press" id="followBtn">📍 回到当前</button>
    </div>
  </div>

  <div class="card reveal d1">
    <div class="prog-top"><b>字幕进度 <em class="pill" id="fullPill">全部生成中</em></b><span id="count">0 / 0</span></div>
    <div id="map" title="点一下跳到那里"><span id="head"></span></div>
    <div id="status"></div>
    <button class="retry press" id="retryBtn"><span class="spin">🔁</span> <span id="retryTxt">重试失败的段</span></button>
    <div class="legend"><span><em style="background:var(--green)"></em>已完成</span><span><em style="background:var(--accent)"></em>识别中</span><span><em style="background:#2a2a2f"></em>待识别</span><span><em style="background:var(--red)"></em>失败</span></div>
  </div>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="tools" role="dialog" aria-label="字幕选项">
  <div class="grab"></div>
  <h2>字幕选项 <button class="sheet-done">完成</button></h2>
  <div class="label" style="margin-top:12px">显示</div>
  <div class="seg" id="modes">
    <span class="thumb"></span>
    <button data-mode="both" class="on">原文 + 翻译</button>
    <button data-mode="tr">只看翻译</button>
    <button data-mode="src">只看原文</button>
  </div>

  <div class="group">
    <button class="item press" id="fullBtn" role="switch" aria-checked="false">
      <span class="badge" style="background:linear-gradient(135deg,#ff9f0a,#ff6a00)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z"/></svg></span>
      <span class="txt"><b>全部生成</b><small id="fullSub">不用边看边等，后台一次做完</small></span>
      <span class="sw"><i></i></span>
    </button>
    <button class="item press" id="srtBtn">
      <span class="badge" style="background:linear-gradient(135deg,#30d158,#0a9e4a)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg></span>
      <span class="txt"><b>导出 SRT 字幕</b><small>按当前显示方式导出，可导入别的播放器</small></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="group">
    <button class="item press danger" id="regenBtn">
      <span class="badge" style="background:linear-gradient(135deg,#ff5f57,#d70015)"><svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg></span>
      <span class="txt"><b id="regenTitle">重新生成字幕</b><small id="regenSub">清掉这个文件已生成的字幕，从头识别</small></span>
    </button>
  </div>
</div>
<div class="sheet" id="settings" role="dialog" aria-label="设置">
  <div class="grab"></div>
  <h2>设置 <button id="closeSettings">完成</button></h2>
  <label>Gemini API Key</label>
  <input id="key" type="password" autocomplete="off" placeholder="AIza...">
  <div class="hint">只存在这台设备的浏览器里。没有的话去 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a> 免费申请一个。</div>
  <label>模型</label>
  <div class="row">
    <select id="model"></select>
    <button class="small-btn press" id="loadModels">刷新列表</button>
  </div>
  <label>翻译成</label>
  <input id="lang" type="text" value="简体中文">
  <div class="chips" id="langChips">
    <button>简体中文</button><button>繁體中文</button><button>English</button><button>日本語</button><button>한국어</button>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const CH = 30;          // 每段秒数
  const AHEAD = 10;       // 最多提前识别几段（10 段 = 5 分钟）
  const WORKERS = 2;      // 同时请求数
  const TARGET_SR = 16000;

  const $ = id => document.getElementById(id);
  const video = $('video'), statusEl = $('status');
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // ---------- 设置 ----------
  const keyEl = $('key'), modelEl = $('model'), langEl = $('lang');
  keyEl.value = ls.get('sub_key') || '';
  langEl.value = ls.get('sub_lang') || '简体中文';
  keyEl.onchange = () => ls.set('sub_key', keyEl.value.trim());
  langEl.onchange = () => { ls.set('sub_lang', langEl.value.trim()); syncChips(); };

  // 设置弹层
  let openId = '';
  const openSheet = (id = 'settings') => {
    if (openId) closeSheet();
    openId = id;
    $(id).classList.add('open'); $('mask').classList.add('open');
    if (id === 'tools') requestAnimationFrame(moveThumb);
  };
  const closeSheet = () => {
    if (!openId) return;
    $(openId).classList.remove('open'); $('mask').classList.remove('open');
    if (openId === 'settings') {
      keyEl.onchange(); langEl.onchange();
      $('keyDot').hidden = !!keyEl.value.trim();
    }
    openId = '';
  };
  $('openSettings').onclick = () => openSheet('settings');
  $('openTools').onclick = () => openSheet('tools');
  $('closeSettings').onclick = closeSheet;
  document.querySelectorAll('.sheet-done').forEach(b => b.onclick = closeSheet);
  $('mask').onclick = closeSheet;
  // 下滑关闭
  document.querySelectorAll('.sheet').forEach(sh => {
    let y0 = null, dy = 0;
    sh.addEventListener('touchstart', e => { if (sh.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
    sh.addEventListener('touchmove', e => {
      if (y0 == null) return;
      dy = Math.max(0, e.touches[0].clientY - y0);
      if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; }
    }, { passive: true });
    sh.addEventListener('touchend', () => {
      if (y0 == null) return;
      sh.style.transition = ''; sh.style.transform = '';
      if (dy > 90) closeSheet();
      y0 = null;
    });
  });
  function syncChips() {
    document.querySelectorAll('#langChips button').forEach(b => b.classList.toggle('on', b.textContent === langEl.value.trim()));
  }
  document.querySelectorAll('#langChips button').forEach(b => b.onclick = () => { langEl.value = b.textContent; langEl.onchange(); });
  syncChips();
  $('keyDot').hidden = !!keyEl.value;
  if (!keyEl.value) setTimeout(() => openSheet('settings'), 350);

  // toast
  let toastT = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function setModels(list, preferred) {
    modelEl.innerHTML = '';
    list.forEach(m => {
      const o = document.createElement('option');
      o.value = o.textContent = m;
      modelEl.appendChild(o);
    });
    if (preferred && list.includes(preferred)) modelEl.value = preferred;
  }
  const savedModel = ls.get('sub_model');
  setModels(savedModel ? [savedModel] : ['gemini-3.6-flash'], savedModel);
  modelEl.onchange = () => ls.set('sub_model', modelEl.value);

  $('loadModels').onclick = async () => {
    const key = keyEl.value.trim();
    if (!key) return setStatus('先填 API Key', true);
    setStatus('获取模型列表…');
    try {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error?.message || r.status);
      const names = (j.models || [])
        .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map(m => m.name.replace(/^models\//, ''))
        .filter(n => /gemini/.test(n) && !/(tts|image|embed|live|audio)/.test(n))
        .sort().reverse();
      const flash = names.find(n => /flash$/.test(n)) || names[0];
      setModels(names, ls.get('sub_model') || flash);
      ls.set('sub_model', modelEl.value);
      setStatus('模型列表已更新');
    } catch (e) { setStatus('获取失败：' + e.message, true); }
  };

  // ---------- 显示模式 ----------
  let mode = ls.get('sub_mode') || 'both';
  const modeBtns = [...document.querySelectorAll('#modes button')], thumb = document.querySelector('#modes .thumb');
  function moveThumb() {
    const b = modeBtns.find(x => x.dataset.mode === mode) || modeBtns[0];
    thumb.style.width = b.offsetWidth + 'px';
    thumb.style.transform = `translateX(${b.offsetLeft - 3}px)`;
  }
  modeBtns.forEach(b => {
    b.classList.toggle('on', b.dataset.mode === mode);
    b.onclick = () => {
      if (mode === b.dataset.mode) return;
      mode = b.dataset.mode; ls.set('sub_mode', mode);
      modeBtns.forEach(x => x.classList.toggle('on', x === b));
      moveThumb();
      rebuildCues();
    };
  });
  addEventListener('resize', moveThumb);
  requestAnimationFrame(moveThumb);

  let lastMsg = '';
  function setStatus(msg, err) {
    if (msg !== lastMsg && msg.split(' · ')[0] !== lastMsg.split(' · ')[0]) {
      statusEl.classList.remove('flash'); void statusEl.offsetWidth; statusEl.classList.add('flash');
    }
    lastMsg = msg;
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!err);
  }

  // ---------- 分段进度条（每格一段，点一下跳过去） ----------
  const mapEl = $('map'), headEl = $('head'), countEl = $('count');
  let cells = [];
  function buildMap() {
    cells.forEach(c => c.remove());
    cells = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < nChunks; i++) { const c = document.createElement('i'); cells.push(c); frag.appendChild(c); }
    mapEl.insertBefore(frag, headEl);
    cells.forEach((c, i) => { c.className = 's' + (state[i] || 0); });
    renderCount(); moveHead();
  }
  function paint(i) {
    const c = cells[i]; if (!c) return;
    const cls = 's' + state[i];
    if (c.className.startsWith(cls)) return;
    c.className = cls + (state[i] === 2 ? ' pop' : '');
    renderCount();
  }
  function renderCount() {
    const done = state.filter(s => s === 2).length;
    countEl.textContent = `${done} / ${nChunks} 段`;
    const failed = state.filter(s => s === 3).length;
    $('retryBtn').classList.toggle('show', failed > 0);
    if (failed) $('retryTxt').textContent = `重试失败的 ${failed} 段`;
  }
  function retry(list) {
    list.forEach(k => { state[k] = 0; tries[k] = 0; paint(k); });
    renderCount();
  }
  $('retryBtn').onclick = () => {
    const list = [];
    state.forEach((s, k) => { if (s === 3) list.push(k); });
    if (!list.length) return;
    const b = $('retryBtn');
    b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
    retry(list);
    setStatus(`🔁 ${list.length} 段重新排队了`);
    toast(`🔁 ${list.length} 段重新排队了`);
  };
  function moveHead() {
    const d = video.duration || nChunks * CH;
    headEl.style.left = d ? Math.min(100, (video.currentTime || 0) / d * 100) + '%' : '0';
  }
  video.addEventListener('timeupdate', moveHead);
  let pendingSeek = null;
  function seekTo(t) {
    if (video.readyState >= 1) { video.currentTime = t; return; }
    pendingSeek = t;           // 还没加载好：记下来，加载完再跳
    try { video.load(); } catch (e) {}
  }
  video.addEventListener('loadedmetadata', () => {
    if (pendingSeek != null) { video.currentTime = pendingSeek; pendingSeek = null; }
  });
  mapEl.addEventListener('click', e => {
    if (!video.duration && !nChunks) return;
    const r = mapEl.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    seekTo(f * (video.duration || nChunks * CH));
    moveHead();
    // 点到红格附近（手指宽度 ±14px 内）就把那些失败段重新排队
    const x = e.clientX - r.left, tol = 14;
    const lo = Math.max(0, Math.floor((x - tol) / r.width * nChunks)), hi = Math.min(nChunks - 1, Math.floor((x + tol) / r.width * nChunks));
    const fail = [];
    for (let k = lo; k <= hi; k++) if (state[k] === 3) fail.push(k);
    if (fail.length) {
      retry(fail);
      toast(`🔁 第 ${fail.map(k => k + 1).join('、')} 段重新排队了`);
    }
  });

  // ---------- 状态 ----------
  let session = 0;        // 换视频时作废旧任务
  let pcm = null, sr = TARGET_SR, nChunks = 0;
  let state = [], tries = [], segs = [];   // state: 0 未做 1 进行中 2 完成 3 放弃
  let track = null;

  function cueText(s) {
    if (mode === 'src') return s.text;
    if (mode === 'tr') return s.tr || s.text;
    return (s.tr && s.tr !== s.text) ? s.text + '\n' + s.tr : s.text;
  }
  function addCue(s) {
    try {
      const c = new VTTCue(s.start, s.end, cueText(s));
      c.line = -2; // 靠下
      track.addCue(c);
    } catch (e) {}
  }
  function rebuildCues() {
    nowKey = '';
    renderList();
    if (!track) return;
    while (track.cues && track.cues.length) track.removeCue(track.cues[0]);
    segs.flat().forEach(addCue);
  }

  // ---------- 字幕列表（跟着播放高亮滚动，点一句跳过去） ----------
  const lyrEl = $('lyr'), followBtn = $('followBtn');
  let lines = [], rows = [], seen = new Set(), activeIdx = -1, follow = true, lyrTimer = 0;
  const esc = t => t.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function renderList() {
    lines = segs.flat().slice().sort((a, b) => a.start - b.start);
    $('lyrCount').textContent = lines.length + ' 句';
    if (!lines.length) {
      lyrEl.innerHTML = '<div class="lyr-empty">字幕生成出来后会按时间出现在这里<br>点任意一句，视频就跳过去</div>';
      rows = []; seen = new Set(); activeIdx = -1; return;
    }
    const keep = lyrEl.scrollTop, frag = document.createDocumentFragment(), now = new Set();
    rows = lines.map((s, k) => {
      const key = s.start.toFixed(2) + s.text;
      now.add(key);
      const el = document.createElement('div');
      el.className = 'ln' + (seen.size && !seen.has(key) ? ' new' : '');
      const main = mode === 'tr' ? (s.tr || s.text) : s.text;
      const sub = mode === 'both' && s.tr && s.tr !== s.text ? `<p>${esc(s.tr)}</p>` : '';
      el.innerHTML = `<time>${fmt(s.start)}</time><div><p>${esc(main)}</p>${sub}</div>`;
      el.onclick = () => { seekTo(s.start + 0.01); follow = true; followBtn.classList.remove('show'); syncList(true); };
      frag.appendChild(el);
      return el;
    });
    seen = now;
    lyrEl.innerHTML = ''; lyrEl.appendChild(frag);
    lyrEl.scrollTop = keep;
    activeIdx = -1; syncList(false);
  }
  let isAudio = false, nowKey = '';
  function setNow(s, dim) {
    $('lyric').classList.toggle('dim', !!(s && dim)); // 只变淡不换字：直接过渡
    const key = s ? s.start + s.text + mode : '';
    if (key === nowKey) return;
    nowKey = key;
    const box = $('lyric');
    box.classList.add('swap');
    clearTimeout(setNow.t);
    setNow.t = setTimeout(() => {
      const main = !s ? '' : mode === 'tr' ? (s.tr || s.text) : s.text;
      $('nowSrc').textContent = main;
      $('nowTr').textContent = s && mode === 'both' && s.tr && s.tr !== s.text ? s.tr : '';
      box.classList.remove('swap');
    }, 180);
  }
  function syncList(smooth) {
    if (isAudio) {
      const t = video.currentTime || 0;
      // 最近开始的一句；说完后变淡留着，安静超过 6 秒才清空
      let k = -1;
      for (let j = 0; j < lines.length && lines[j].start <= t + 0.05; j++) k = j;
      const s = lines[k];
      if (!s || t > s.end + 6) setNow(null);
      else setNow(s, t > s.end + 0.6);
    }
    if (!rows.length) return;
    const t = video.currentTime || 0;
    let lo = 0, hi = lines.length - 1, k = -1;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (lines[m].start <= t + 0.05) { k = m; lo = m + 1; } else hi = m - 1; }
    if (k !== activeIdx) {
      rows.forEach((r, j) => r.classList.toggle('past', j < k && lines[j].end < t));
      if (rows[activeIdx]) rows[activeIdx].classList.remove('on');
      if (rows[k]) rows[k].classList.add('on');
      activeIdx = k;
      if (follow && rows[k]) {
        const top = rows[k].offsetTop - lyrEl.clientHeight * 0.3;
        lyrEl.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' });
      }
    }
  }
  video.addEventListener('timeupdate', () => syncList(true));
  video.addEventListener('play', () => { document.body.classList.add('playing'); tick(); wake(); });
  video.addEventListener('pause', () => { document.body.classList.remove('playing'); wake(); });

  // 控件自动淡出：播放中 3 秒没操作就隐藏，点一下卡片再出现
  const nowEl = $('now');
  let calmT = 0;
  function wake() {
    clearTimeout(calmT);
    nowEl.classList.remove('calm');
    if (!video.paused && isAudio) calmT = setTimeout(() => { if (!dragging && !video.paused) nowEl.classList.add('calm'); }, 3000);
  }
  // 隐藏时控件 pointer-events: none，所以这一下只会唤出，不会误触按钮
  nowEl.addEventListener('pointerdown', wake, true);
  video.addEventListener('seeked', () => { if (!nowEl.classList.contains('calm')) wake(); });
  video.addEventListener('ended', () => document.body.classList.remove('playing'));

  // ---------- 音频播放条（自制） ----------
  const seekEl = $('seek'), fillEl = $('fill'), knobEl = $('knob');
  let dragging = false, raf = 0;
  const durOf = () => (isFinite(video.duration) && video.duration) || nChunks * CH || 0;
  function drawBar(t) {
    const d = durOf(), f = d ? Math.max(0, Math.min(1, t / d)) : 0;
    fillEl.style.transform = `scaleX(${f})`;
    knobEl.style.left = (f * 100) + '%';
    $('tCur').textContent = fmt(t);
    $('tDur').textContent = d ? '-' + fmt(Math.max(0, d - t)) : '0:00';
  }
  function tick() { // 播放时用 rAF 刷新，进度条才会顺滑（timeupdate 一秒只有 4 次）
    cancelAnimationFrame(raf);
    if (!isAudio) return;
    if (!dragging) drawBar(video.currentTime || 0);

        if (!(await need(off, 4))) break;

  const readDV = async (file, a, b) => new DataView(await file.slice(a, b).arrayBuffer());

  // 只读顶层 box 头，找到 moov 后只把 moov 读进来（通常几 MB）
  async function openMp4Audio(file) {

      if (first && !['ftyp', 'moov', 'mdat', 'free', 'wide', 'skip', 'pnot', 'uuid'].includes(type)) return null;

      let hdr = 8;
      if (size === 1) { size = h.getUint32(8) * 4294967296 + h.getUint32(12); hdr = 16; }
      else if (size === 0) size = file.size - off;
      if (size < hdr) return null;
      if (type === 'moov') { moov = await readDV(file, off + hdr, off + size); break; }
      off += size;
    }
    if (!moov) return null;

    const kids = (dv, s, e) => {
      const out = [];
      while (s + 8 <= e) {
        let size = dv.getUint32(s), hdr = 8;
        const type = fourcc(dv, s + 4);
        if (size === 1) { size = dv.getUint32(s + 8) * 4294967296 + dv.getUint32(s + 12); hdr = 16; }
        else if (size === 0) size = e - s;
        if (size < hdr || s + size > e) break;
        out.push({ type, s: s + hdr, e: s + size });
        s += size;
      }
      return out;
    };
    const find = (dv, box, path) => {
      let cur = box;
      for (const t of path) { cur = kids(dv, cur.s, cur.e).find(b => b.type === t); if (!cur) return null; }
      return cur;
    };

    const root = { s: 0, e: moov.byteLength };
    let sawSound = false;
    const mvhd = find(moov, root, ['mvhd']);
    const movieTs = mvhd ? moov.getUint32(mvhd.s + (moov.getUint8(mvhd.s) === 1 ? 20 : 12)) : 1000;

    for (const trak of kids(moov, 0, moov.byteLength).filter(b => b.type === 'trak')) {
      const hdlr = find(moov, trak, ['mdia', 'hdlr']);
      if (!hdlr || fourcc(moov, hdlr.s + 8) !== 'soun') continue;
      sawSound = true;
      const mdhd = find(moov, trak, ['mdia', 'mdhd']);
      const stbl = find(moov, trak, ['mdia', 'minf', 'stbl']);
      if (!mdhd || !stbl) continue;
      const ts = moov.getUint32(mdhd.s + (moov.getUint8(mdhd.s) === 1 ? 20 : 12));
      const t = {};
      kids(moov, stbl.s, stbl.e).forEach(b => { t[b.type] = b; });
      if (!t.stsd || !t.stts || !t.stsc || !t.stsz || !(t.stco || t.co64)) continue;

      // 编码格式
      const entry = kids(moov, t.stsd.s + 8, t.stsd.e)[0];
      if (!entry) continue;
      let codec = null, asc = null;
      if (entry.type === '.mp3' || entry.type === 'ms\0U') codec = 'mp3';
      else if (entry.type === 'mp4a') {
        // 在 sample entry 里找 esds（QuickTime 可能套在 wave 里）
        let p = -1;
        for (let k = entry.s; k + 4 <= entry.e; k++) if (fourcc(moov, k) === 'esds') { p = k + 4; break; }
        if (p < 0) continue;
        const end = moov.getUint32(p - 8) + p - 8;
        p += 4; // version/flags
        const desc = () => {
          const tag = moov.getUint8(p++); let len = 0, b;
          do { b = moov.getUint8(p++); len = (len << 7) | (b & 0x7f); } while (b & 0x80);
          return { tag, len };
        };
        let d = desc();
        if (d.tag !== 3) continue;
        p += 2; const fl = moov.getUint8(p++);
        if (fl & 0x80) p += 2;
        if (fl & 0x40) p += moov.getUint8(p) + 1;
        if (fl & 0x20) p += 2;
        d = desc();
        if (d.tag !== 4) continue;
        const oti = moov.getUint8(p);
        p += 13;
        if (oti === 0x6B || oti === 0x69) codec = 'mp3';
        else if (oti === 0x40 || oti === 0x66 || oti === 0x67 || oti === 0x68) {
          if (p >= end) continue;
          d = desc();
          if (d.tag !== 5 || d.len < 2) continue;
          const ascStart = p, ascLen = d.len;
          let pos = 0;
          const rd = nb => {
            let v = 0;
            for (let k = 0; k < nb; k++, pos++) {
              const byte = (pos >> 3) < ascLen ? moov.getUint8(ascStart + (pos >> 3)) : 0;
              v = v * 2 + ((byte >> (7 - (pos & 7))) & 1);
            }
            return v;
          };
          let aot = rd(5); if (aot === 31) aot = 32 + rd(6);
          let fi = rd(4);
          if (fi === 15) { // 显式采样率 → 映射到最接近的标准档位
            const freq = rd(24);
            const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
            fi = rates.reduce((bi, r, k) => Math.abs(r - freq) < Math.abs(rates[bi] - freq) ? k : bi, 0);
          }
          let ch = rd(4);
          if (ch < 1 || ch > 7) ch = 2;
          codec = 'aac';
          asc = { profile: (aot >= 1 && aot <= 4) ? aot - 1 : 1, fi, ch };
        }
      }
      if (!codec) continue;

      // 样本表
      const u32 = o => moov.getUint32(o);
      const sizeConst = u32(t.stsz.s + 4), n = u32(t.stsz.s + 8);
      if (!n) continue; // 分片 MP4，样本不在 moov 里
      const sizes = new Uint32Array(n);
      for (let k = 0; k < n; k++) sizes[k] = sizeConst || u32(t.stsz.s + 12 + k * 4);

      const dts = new Float64Array(n + 1);
      { let k = 0, cur = 0; const ec = u32(t.stts.s + 4);
        for (let e = 0; e < ec && k < n; e++) {
          const cnt = u32(t.stts.s + 8 + e * 8), dl = u32(t.stts.s + 12 + e * 8);
          for (let c = 0; c < cnt && k < n; c++) { dts[k++] = cur; cur += dl; }
        }
        while (k < n) dts[k++] = cur;
        dts[n] = cur; }

      const co = t.stco || t.co64, is64 = !t.stco;
      const nco = u32(co.s + 4);
      const chunkOff = k => is64 ? u32(co.s + 8 + k * 8) * 4294967296 + u32(co.s + 12 + k * 8) : u32(co.s + 8 + k * 4);
      const offs = new Float64Array(n);
      { const ec = u32(t.stsc.s + 4); let k = 0;
        for (let e = 0; e < ec; e++) {
          const fc = u32(t.stsc.s + 8 + e * 12) - 1, spc = u32(t.stsc.s + 12 + e * 12);
          const nextFc = e + 1 < ec ? u32(t.stsc.s + 8 + (e + 1) * 12) - 1 : nco;
          for (let c = fc; c < nextFc && k < n; c++) {
            let o = chunkOff(c);
            for (let m = 0; m < spc && k < n; m++) { offs[k] = o; o += sizes[k]; k++; }
          }
        } }

      // 编辑列表：开头空白 + 媒体起点
      let shift = 0;
      const elst = find(moov, trak, ['edts', 'elst']);
      if (elst) {
        const v1 = moov.getUint8(elst.s) === 1, ec = u32(elst.s + 4);
        let p = elst.s + 8;
        for (let e = 0; e < ec; e++) {
          const dur = v1 ? u32(p) * 4294967296 + u32(p + 4) : u32(p);
          const mt = v1 ? moov.getInt32(p + 8) * 4294967296 + u32(p + 12) : moov.getInt32(p + 4);
          p += v1 ? 20 : 12;
          if (mt === -1) { shift += dur / movieTs; continue; }
          shift -= mt / ts; break;
        }
      }

      const time = k => dts[k] / ts + shift;
      return { file, codec, asc, n, sizes, offs, time, duration: Math.max(0, time(n)) };
    }
    return sawSound ? null : { noAudio: true }; // 有音轨但格式不认识 → 走兜底
  }

  // 第 i 段：直接拼出 AAC(ADTS)/MP3 帧，File.slice 是惰性的，不会把整个视频读进内存
  function mp4Chunk(i) {
    const m = mp4, t0 = i * CH, t1 = (i + 1) * CH;
    const lb = x => { let lo = 0, hi = m.n; while (lo < hi) { const mid = (lo + hi) >> 1; if (m.time(mid) < x) lo = mid + 1; else hi = mid; } return lo; };
    const a = lb(t0), b = lb(t1);
    if (b <= a) return null;
    const parts = [];
    for (let k = a; k < b; k++) {
      if (m.sizes[k] < 2 || (m.codec === 'aac' && m.sizes[k] > 8184)) continue; // 空帧/超长帧是坏的，跳过
      if (m.codec === 'aac') {
        const len = m.sizes[k] + 7, { profile, fi, ch } = m.asc;
        parts.push(new Uint8Array([0xFF, 0xF1, (profile << 6) | (fi << 2) | (ch >> 2),
          ((ch & 3) << 6) | (len >> 11), (len >> 3) & 0xFF, ((len & 7) << 5) | 0x1F, 0xFC]));
      }
      parts.push(m.file.slice(m.offs[k], m.offs[k] + m.sizes[k]));
    }
    const base = Math.max(0, m.time(a));
    return {
      blob: new Blob(parts, { type: m.codec === 'aac' ? 'audio/aac' : 'audio/mp3' }),
      mime: m.codec === 'aac' ? 'audio/aac' : 'audio/mp3',
      dur: m.time(b) - m.time(a), base
    };
  }

  // ---------- 静音检测：防止 Gemini 对着没声音的音频编台词 ----------
  const SILENT = 0.006;   // 50ms 窗口 RMS 低于这个当作没声音（约 -44 dBFS）
  const WIN = 0.05;
  function levelsOf(arr, rate, s0, s1, scale) {
    const w = Math.max(1, Math.round(rate * WIN)), n = Math.ceil((s1 - s0) / w);
    const out = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const a = s0 + k * w, b = Math.min(s1, a + w);
      let sum = 0;
      for (let j = a; j < b; j++) { const v = arr[j] / scale; sum += v * v; }
      out[k] = Math.sqrt(sum / Math.max(1, b - a));
    }
    return out;
  }
  function maxLevel(lv, t0 = 0, t1 = Infinity) {
    let m = 0;
    const a = Math.max(0, Math.floor(t0 / WIN)), b = Math.min(lv.length, Math.ceil(t1 / WIN));
    for (let k = a; k < b; k++) if (lv[k] > m) m = lv[k];
    return m;
  }
  // 拿到这一段的音量曲线；解码不了就返回 null（不做检测，照常识别）
  async function chunkLevels(i, piece) {
    if (!mp4) {
      const s0 = Math.floor(i * CH * sr), s1 = Math.min(pcm.length, Math.floor((i + 1) * CH * sr));
      return levelsOf(pcm, sr, s0, s1, 32768);
    }
    const r = await decodeChunk(piece);
    return r && r.lv;
  }
  // MP4 段解码成 16k 单声道：拿来测音量，也拿来生成标准 WAV 发给 Gemini（比直接发 AAC 稳）
  async function decodeChunk(piece) {
    if (piece.decoded !== undefined) return piece.decoded;
    piece.decoded = null;
    try {
      const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      const ctx = new OAC(1, 1, TARGET_SR);
      const buf = await piece.blob.arrayBuffer();
      const ab = await new Promise((res, rej) => {
        const p = ctx.decodeAudioData(buf, res, rej);
        if (p && p.then) p.then(res, rej);
      });
      const d0 = ab.getChannelData(0), n = ab.length;
      let mono = d0;
      if (ab.numberOfChannels > 1) {
        mono = new Float32Array(n);
        for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let k = 0; k < n; k++) mono[k] += d[k] / ab.numberOfChannels; }
      }
      piece.decoded = { lv: levelsOf(mono, ab.sampleRate, 0, n, 1), mono, rate: ab.sampleRate };
      return piece.decoded;
    } catch (e) { return null; }
  }

  async function decode(buf) {
    let ctx;
    try { ctx = new AudioContext({ sampleRate: TARGET_SR }); }
    catch (e) { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    try {
      return await new Promise((res, rej) => {
        const p = ctx.decodeAudioData(buf, res, rej);
        if (p && p.then) p.then(res, rej);
      });
    } finally { try { ctx.close(); } catch (e) {} }
  }

  function toMonoInt16(ab) {
    const n = ab.length, chs = ab.numberOfChannels;
    const out = new Int16Array(n);
    const data = [];
    for (let c = 0; c < chs; c++) data.push(ab.getChannelData(c));
    for (let i = 0; i < n; i++) {
      let v = 0;
      for (let c = 0; c < chs; c++) v += data[c][i];
      v /= chs;
      out[i] = v > 1 ? 32767 : v < -1 ? -32768 : v * 32767;
    }
    return out;
  }

  function wavFromFloat(mono, rate) {
    const ratio = rate / TARGET_SR, len = Math.floor(mono.length / ratio);
    const view = new DataView(new ArrayBuffer(44 + len * 2));
    const w = (o, s) => { for (let k = 0; k < s.length; k++) view.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, TARGET_SR, true); view.setUint32(28, TARGET_SR * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true); w(36, 'data'); view.setUint32(40, len * 2, true);
    for (let k = 0; k < len; k++) {
      const v = mono[Math.floor(k * ratio)];
      view.setInt16(44 + k * 2, v > 1 ? 32767 : v < -1 ? -32768 : v * 32767, true);
    }
    return new Blob([view.buffer], { type: 'audio/wav' });
  }

  // 取第 i 段，降到 16k，打包成 wav
  function chunkWav(i) {
    const s0 = Math.floor(i * CH * sr), s1 = Math.min(pcm.length, Math.floor((i + 1) * CH * sr));
    const ratio = sr / TARGET_SR;
    const len = Math.floor((s1 - s0) / ratio);
    const view = new DataView(new ArrayBuffer(44 + len * 2));
    const w = (o, s) => { for (let k = 0; k < s.length; k++) view.setUint8(o + k, s.charCodeAt(k)); };
    w(0, 'RIFF'); view.setUint32(4, 36 + len * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, TARGET_SR, true); view.setUint32(28, TARGET_SR * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true); w(36, 'data'); view.setUint32(40, len * 2, true);
    for (let k = 0; k < len; k++) view.setInt16(44 + k * 2, pcm[s0 + Math.floor(k * ratio)], true);
    return { blob: new Blob([view.buffer], { type: 'audio/wav' }), mime: 'audio/wav', dur: (s1 - s0) / sr, base: i * CH };
  }

  function blobToB64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }

  // ---------- 调度：优先当前播放位置 ----------
  function pickNext() {
    const cur = Math.floor((video.currentTime || 0) / CH);
    for (let i = cur; i < Math.min(nChunks, cur + AHEAD); i++) if (state[i] === 0) return i;
    if (fullMode) {
      for (let i = cur; i < nChunks; i++) if (state[i] === 0) return i;
      for (let i = 0; i < cur; i++) if (state[i] === 0) return i;
    }
    return -1;
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  async function worker(my) {
    while (my === session) {
      const i = pickNext();
      if (i < 0) { await sleep(600); continue; }
      state[i] = 1; paint(i);
      try {
        const list = await recognize(i);
        if (my !== session) return;
        segs[i] = list;
        list.forEach(addCue);
        state[i] = 2; paint(i);
        if (list.length) renderList();
        saveCache();
        updateProgress();
      } catch (err) {
        if (my !== session) return;
        tries[i]++;
        state[i] = tries[i] >= 3 ? 3 : 0; paint(i);
        setStatus(`第 ${i + 1} 段出错：${err.message}` + (state[i] === 3 ? '（已跳过，可以点下面的按钮重试）' : '（稍后重试）'), true);
        await sleep(err.retryAfter || 3000);
      }
    }
  }

  function updateProgress() {
    const done = state.filter(s => s >= 2).length;
    renderCount();
    if (done === nChunks) {
      const skipped = state.filter(s => s === 3).length;
      return setStatus(skipped ? `生成完毕，有 ${skipped} 段出错跳过了` : '✅ 全部字幕生成好了，下次选同一个视频会直接挂上');
    }
    let k = Math.floor((video.currentTime || 0) / CH);
    while (k < nChunks && state[k] >= 2) k++;
    const t = Math.min(k * CH, video.duration || k * CH);
    setStatus(`已识别 ${done}/${nChunks} 段 · 字幕已覆盖到 ${fmt(t)}`);
  }
  const fmt = s => { s = Math.floor(s); const m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; };

  // ---------- 调 Gemini ----------
  async function recognize(i) {
    const key = keyEl.value.trim();
    if (!key) { const e = new Error('还没填 API Key'); e.retryAfter = 5000; throw e; }
    const model = modelEl.value;
    const lang = langEl.value.trim() || '简体中文';
    const piece = mp4 ? mp4Chunk(i) : chunkWav(i);
    if (!piece || piece.dur <= 0.05) return [];
    let { blob, dur, mime, base } = piece;
    const lv = await chunkLevels(i, piece);
    if (lv && maxLevel(lv) < SILENT) return []; // 整段静音，不用问 Gemini
    if (mp4 && piece.decoded) { blob = wavFromFloat(piece.decoded.mono, piece.decoded.rate); mime = 'audio/wav'; }
    const b64 = await blobToB64(blob);

    const prev = (segs[i - 1] || []).slice(-3).map(s => s.text).join(' / ');
    const prompt =
`这是视频里的一段音频，长约 ${dur.toFixed(1)} 秒。
请把里面所有人声对白逐句转写成原语言文字（text），并给每句附上${lang}翻译（tr）；如果原文已经是${lang}，tr 和 text 相同。
start / end 是这句话在这段音频里的开始和结束秒数（相对本段，0 到 ${dur.toFixed(1)} 之间，保留一位小数）。
每句控制在一行字幕的长度，长句拆开。
没有人声（纯音乐、静音、环境声、噪音）就必须返回空数组 []。
绝对不要编造：只输出这段音频里真实听到的话，不要补充任何常见的电影台词、客套话、片头片尾字幕或"感谢观看"之类的内容。` +
      (prev ? `\n上一段结尾的台词（仅供理解语境，不要重复输出）：${prev}` : '');

    const body = {
      contents: [{ parts: [
        { inline_data: { mime_type: mime, data: b64 } },
        { text: prompt }
      ] }],
      generationConfig: {
        temperature: 0,
        responseMimeType: 'application/json',
        responseSchema: {
          type: 'ARRAY',
          items: {
            type: 'OBJECT',
            properties: {
              start: { type: 'NUMBER' }, end: { type: 'NUMBER' },
              text: { type: 'STRING' }, tr: { type: 'STRING' }
            },
            required: ['start', 'end', 'text', 'tr']
          }
        }
      }
    };

    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(j.error?.message || ('HTTP ' + r.status));
      if (r.status === 429) e.retryAfter = 15000;
      throw e;
    }
    const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
    let arr;
    try { arr = JSON.parse(txt); } catch (e) { throw new Error('返回内容解析失败'); }
    if (!Array.isArray(arr)) arr = [];

    return arr
      .filter(s => s && s.text)
      .map(s => {
        let a = Math.max(0, Math.min(dur, +s.start || 0));
        let b = Math.max(0, Math.min(dur, +s.end || 0));
        if (b <= a) b = Math.min(dur, a + 2);
        return { a, b, start: base + a, end: base + b, text: String(s.text).trim(), tr: String(s.tr || '').trim() };
      })
      // 落在静音位置的字幕是编出来的，丢掉（前后留 0.3 秒余量，时间戳不一定准）
      .filter(s => !lv || maxLevel(lv, s.a - 0.3, s.b + 0.3) >= SILENT)
      .map(({ a, b, ...s }) => s);
  }

  video.addEventListener('seeked', () => { if (nChunks) updateProgress(); });
})();
</script>
</body>
</html>
